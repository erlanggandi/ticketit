# Dev override — auto-load saat `docker compose up` tanpa -f
# Bind mount source code ke container biar edit di host langsung reflektif,
# tapi vendor/node_modules/public/build tetap dari image (named volume) agar fresh clone tanpa `composer install` tetap jalan.
# Untuk produksi: pakai `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build` (override ini tidak ter-load)

services:
  app:
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - public_build:/var/www/html/public/build
    environment:
      AUTO_MIGRATE: "true"

  scheduler:
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - public_build:/var/www/html/public/build

  nginx:
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
      - public_build:/var/www/html/public/build:ro

volumes:
  vendor:
  node_modules:
  public_build:
